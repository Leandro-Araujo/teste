<title>Goiabeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #1d2a1c;
    --panel: rgba(18, 28, 17, 0.72);
    --line: rgba(236, 244, 220, 0.16);
    --ink: #f3f6ec;
    --mute: #b9c6ab;
    --guava: #c7d65a;
    --flesh: #f07a86;
    --display: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
    --body: 'Public Sans', 'Segoe UI', Arial, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #card { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 14px 18px 14px; max-width: min(320px, calc(100% - 32px)); box-sizing: border-box; }
  h1 { margin: 0; font: 800 38px/1 var(--display); letter-spacing: -.02em; }
  h1 i { display: block; font: italic 400 14px var(--body); color: var(--guava); letter-spacing: 0; margin-top: 6px; }
  #card p { margin: 10px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--mute); }
  #count { display: flex; gap: 18px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  #count div { display: flex; flex-direction: column; }
  #count b { font: 800 22px var(--display); font-variant-numeric: tabular-nums; }
  #count span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  #views { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; padding: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); box-sizing: border-box; }
  #views button { font: 600 13px var(--body); color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  #views button:hover { background: rgba(255,255,255,.08); }
  #views button.on { background: var(--ink); color: #1d2a1c; }
  #views button:focus-visible { outline: 2px solid var(--guava); outline-offset: 2px; }
  #hint { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 8px 12px; font-size: 12.5px; color: var(--mute); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 500 16px var(--display); color: var(--mute); background: var(--bg); }
  @media (max-width: 640px) { h1 { font-size: 30px; } #card p { display: none; } #hint { display: none; } }
</style>

<div id="stage"></div>
<div id="card" class="panel">
  <h1>Goiabeira<i>Psidium guajava · em plena safra</i></h1>
  <p>Casca lisa que descasca em placas, folhas opostas com nervuras marcadas e goiabas em todos os pontos de maturação, da verde à amarela madura.</p>
  <div id="count"><div><b id="nFruit">0</b><span>Goiabas</span></div><div><b id="nLeaf">0</b><span>Folhas</span></div><div><b id="nFallen">0</b><span>No chão</span></div></div>
</div>
<div id="hint" class="panel">Arraste para girar · role ou pince para aproximar</div>
<div id="views" class="panel">
  <button type="button" data-v="geral" class="on">Vista geral</button>
  <button type="button" data-v="frutas">Frutas de perto</button>
  <button type="button" data-v="tronco">Tronco</button>
  <button type="button" data-v="chao">Goiaba aberta</button>
  <button type="button" id="bWind">Vento: ligado</button>
</div>
<div id="loading">Plantando a goiabeira…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function bootTree() {

const $ = id => document.getElementById(id);

}

/* ---------- céu e luz ---------- */
const sunDir = new THREE.Vector3(.55, .78, .35).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { sunDir: { value: sunDir } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 sunDir; varying vec3 vD; void main(){ float h = vD.y; vec3 c = mix(vec3(0.83,0.88,0.80), vec3(0.34,0.56,0.82), pow(max(h,0.0), 0.6)); c = mix(c, vec3(0.55,0.6,0.5), smoothstep(0.02,-0.2,h)); float s = max(dot(vD, sunDir), 0.0); c += vec3(1.0,0.9,0.7) * (pow(s, 600.0) * 5.0 + pow(s, 10.0) * 0.25); gl_FragColor = vec4(c, 1.0); }'

scene.add(sky);
{
  const eq = makeTex(512, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#5f8fd0'); gr.addColorStop(.48, '#d8e2d0'); gr.addColorStop(.52, '#6f7f55'); gr.addColorStop(1, '#3e4a2c'); g.fillStyle = gr; g.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 6) { g.fillStyle = `rgba(60,90,40,${R(.5, .9)})`; const hh = R(8, 30); g.fillRect(x, h * .5 - hh, 7, hh); } const sg = g.createRadialGradient(w * .3, h * .2, 0, w * .3, h * .2, 30); sg.addColorStop(0, '#fffbe8'); sg.addColorStop(1, 'rgba(255,250,230,0)'); g.fillStyle = sg; g.fillRect(0, 0, w, h); });

  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(eq).texture; pm.dispose();
}
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x5b6a3a, .55));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.3);
sun.position.copy(sunDir).multiplyScalar(30); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 5, far: 70 });
sun.shadow.bias = -.0003; sun.shadow.normalBias = .02;
scene.add(sun);

/* ---------- casca: lisa, descascando em placas (típica da goiabeira) ---------- */
const barkCanvas = document.createElement('canvas'); barkCanvas.width = 1024; barkCanvas.height = 1024;
const barkHeight = document.createElement('canvas'); barkHeight.width = 512; barkHeight.height = 512;
{
  const g = barkCanvas.getContext('2d'), w = 1024, h = 1024;
  noiseFill(g, w, h, [138, 100, 70], 16, 6);
  const tones = ['#a8734c', '#7a5238', '#c79a6c', '#6b5846', '#94704f', '#9a8f78', '#d9b98c', '#5e4636', '#b8683f', '#9b8a74'];
  // placas irregulares esticadas na vertical
  for (let i = 0; i < 900; i++) {
    const x = R(0, w), y = R(0, h), rw = R(12, 55), rh = rw * R(1.4, 3.2), col = tones[(rnd() * tones.length) | 0];
    wrapDraw(w, h, x, y, rh, (X, Y) => {
      g.save(); g.translate(X, Y); g.rotate(R(-.25, .25));
      g.fillStyle = col; g.globalAlpha = R(.55, .95);
      g.beginPath(); const n = 9; for (let k = 0; k <= n; k++) { const a = k / n * Math.PI * 2, rr = 1 + R(-.25, .2); g.lineTo(Math.cos(a) * rw * rr, Math.sin(a) * rh * rr); } g.fill();
      g.globalAlpha = .45; g.strokeStyle = 'rgba(70,50,35,.8)'; g.lineWidth = R(1, 2.5); g.stroke();
      g.globalAlpha = .25; g.fillStyle = '#fff'; g.beginPath(); g.ellipse(-rw * .3, -rh * .3, rw * .25, rh * .15, 0, 0, 7); g.fill();
      g.restore();
    });
  }
  g.globalAlpha = 1;
  // bordas levantadas das placas e fissuras finas
  for (let i = 0; i < 260; i++) { g.strokeStyle = `rgba(${rnd() < .5 ? '60,42,30' : '235,220,195'},${R(.2, .5)})`; g.lineWidth = R(.6, 1.8); g.beginPath(); let x = R(0, w), y = R(0, h); g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += R(-8, 8); y += R(6, 22); g.lineTo(x, y); } g.stroke(); }
  // manchas de líquen verde-acinzentado
  for (let i = 0; i < 70; i++) { const x = R(0, w), y = R(0, h), r = R(6, 30); wrapDraw(w, h, x, y, r, (X, Y) => { const gr = g.createRadialGradient(X, Y, 0, X, Y, r); gr.addColorStop(0, 'rgba(150,165,120,.55)'); gr.addColorStop(1, 'rgba(150,165,120,0)'); g.fillStyle = gr; g.fillRect(X - r, Y - r, 2 * r, 2 * r); for (let k = 0; k < 10; k++) { g.fillStyle = 'rgba(200,205,170,.5)'; g.fillRect(X + R(-r, r) * .6, Y + R(-r, r) * .6, 2, 2); } }); }
  const hg = barkHeight.getContext('2d'); hg.drawImage(barkCanvas, 0, 0, 512, 512);
  const d = hg.getImageData(0, 0, 512, 512), a = d.data; for (let i = 0; i < a.length; i += 4) { const v = (a[i] + a[i + 1] + a[i + 2]) / 3; a[i] = a[i + 1] = a[i + 2] = v; } hg.putImageData(d, 0, 0);
}
const barkTex = new THREE.CanvasTexture(barkCanvas); barkTex.wrapS = barkTex.wrapT = THREE.RepeatWrapping; barkTex.anisotropy = ANISO; barkTex.encoding = THREE.sRGBEncoding;
const barkN = heightToNormal(barkHeight, 3.2);
const barkMat = new THREE.MeshStandardMaterial({ map: barkTex, normalMap: barkN, normalScale: new THREE.Vector2(.9, .9), roughness: .72 });

/* ---------- galhos: tubos afunilados ao longo de curvas ---------- */
const branches = [], twigs = [];
function taperTube(curve, r0, r1, seg, radial) {

    const t = i / seg, P = curve.getPointAt(t), N = frames.normals[i], B = frames.binormals[i];

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);

const UP = new THREE.Vector3(0, 1, 0);
function randomTilt(dir, amount) {

  return dir.clone().applyAxisAngle(axis, amount).normalize();

  const kids = depth === 0 ? 3 : depth <= 2 ? 3 : 2 + (rnd() < .55 ? 1 : 0);
  for (let k = 0; k < kids; k++) {
    const t = depth === 0 ? .92 : R(.45, 1);
    const at = curve.getPointAt(t), tan = curve.getTangentAt(t);
    const around = k / kids * Math.PI * 2 + R(-.4, .4);

// tronco curto que se divide baixo em três pernadas, como é comum na goiabeira
grow(new THREE.Vector3(0, -.05, 0), new THREE.Vector3(.08, 1, .05).normalize(), 1.15, .24, 0);
const woodParts = branches.map(b => taperTube(b.curve, b.r0, b.r1, b.depth < 2 ? 14 : 7, b.depth < 2 ? 14 : b.depth < 3 ? 9 : 5));
// raízes aparentes na base
for (let i = 0; i < 6; i++) {
  const a = i / 6 * Math.PI * 2 + R(-.3, .3), l = R(.45, .75);
  const c = new THREE.CatmullRomCurve3([new THREE.Vector3(0, .2, 0), new THREE.Vector3(Math.cos(a) * .22, .05, Math.sin(a) * .22), new THREE.Vector3(Math.cos(a) * l, -.14, Math.sin(a) * l)]);

function mergeIndexed(list) {

const wood = new THREE.Mesh(mergeIndexed(woodParts), barkMat); wood.castShadow = wood.receiveShadow = true; scene.add(wood);

/* ---------- folha: elíptica, nervuras paralelas bem marcadas ---------- */
function leafCanvas(dry) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d'), w = 512, h = 256;
  const half = x => { const t = x / w; return h * .44 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.02)), .75) * (1 - .15 * t); };
