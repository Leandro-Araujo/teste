<script>

const OUT = '#1a1420';
const PAL = {
  g0: '#2f6b2c', g1: '#3f8a34', g2: '#4fa33d', g3: '#67ba4a', g4: '#94d466',
  d0: '#6a4526', d1: '#8c603a', d2: '#ad7c4c', d3: '#c99a62', d4: '#e2bd84',

/* =========================================================================

/* ---------- objetos maiores: árvore, casa, arbustos, pedras ---------- */
const SPR = {};
function treeSprite(v) {
